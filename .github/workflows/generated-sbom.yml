name: Generated SBOM baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  sbom-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: baseline-sbom
          upload-artifact: true
          upload-release-assets: false
          dependency-snapshot: false

      - name: Compare with latest successful main artifact
        if: github.event_name == 'pull_request'
        id: sbomlyze
        uses: rezmoss/sbomlyze@02b36c355ccc967caa8aec364172f4724e9e8df0
        with:
          sbom-path: sbom.cdx.json
          baseline: workflow-artifact
          baseline-artifact: baseline-sbom
          baseline-artifact-path: baseline-sbom
          fail-on: integrity-drift
          sarif: true

      - name: Upload SARIF
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          steps.sbomlyze.outputs.report-sarif != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ steps.sbomlyze.outputs.report-sarif }}
